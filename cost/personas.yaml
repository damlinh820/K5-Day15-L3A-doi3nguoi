# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Thay mọi dòng "(ví dụ)" bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng nếu đưa vào dùng — 3 kịch bản, chưa phải số người dùng đo được
  low: 100
  base: 500
  high: 1000
  source: "Tự ước tính CP4: prototype chưa có số người dùng thật; chỉ dùng để phân tích độ nhạy, không khẳng định quy mô thị trường."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.5
    uses_per_month: 2
    turns_per_session: 1    # số lượt hỏi trong một phiên
    source: "Tự ước tính CP4: persona ít theo dõi; chưa có dữ liệu tần suất thực."
  - name: dung_vua
    share: 0.3
    uses_per_month: 6
    turns_per_session: 3
    source: "Tự ước tính CP4: persona theo dõi định kỳ; chưa có dữ liệu tần suất thực."
  - name: dung_nhieu
    share: 0.2
    uses_per_month: 15
    turns_per_session: 5
    source: "Tự ước tính CP4: persona theo dõi thường xuyên; chưa có dữ liệu tần suất thực."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token
  - model: gpt-5.4-nano
    input: 0.20
    output: 1.25
    source: "OpenAI API docs, https://developers.openai.com/api/docs/models/gpt-5.4-nano, xem 28/11/2026"
  - model: gpt-5.4-mini
    input: 0.75
    output: 4.50
    source: "OpenAI, https://openai.com/index/introducing-gpt-5-4-mini-and-nano/, xem 28/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
